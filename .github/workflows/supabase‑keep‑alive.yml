name: Supabase Keep Alive
run-name: Ping Supabase to prevent pause

on:
  schedule:
    # UTC时间，每天凌晨0点执行；对应北京时间早上8点
    - cron: '0 0 * * *'
  # 允许手动触发测试
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu‑latest
    steps:
      - name: Send ping request
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SUPABASE_URL }}/rest/v1/?select=*&limit=0" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
